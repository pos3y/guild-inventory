<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Storage ☁️</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        /* --- ธีมหลัก (น่ารัก ขาว มน) --- */
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f9fbfc; 
            color: #4a4a4a; 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #7cb9e8; font-weight: 600; margin-bottom: 30px; }

        /* --- เมนู (Tabs) --- */
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .tab-btn { 
            background: white; border: none; padding: 12px 25px; border-radius: 30px; 
            font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 600; 
            color: #a0a0a0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            transition: all 0.3s ease; 
        }
        .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .tab-btn.active { background: #ffe4e1; color: #ff8b94; }

        /* --- หน้าต่างๆ --- */
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ตัวกรอง (Filter Bar) --- */
        .filter-bar {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .filter-btn {
            background: white; border: 1px solid #eee; padding: 6px 15px; border-radius: 20px;
            font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 600;
            color: #a0a0a0; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .filter-btn:hover { background: #fdf5f6; border-color: #ffc6c9; color: #ff8b94; }
        .filter-btn.active { background: #ffe4e1; border-color: #ff8b94; color: #ff8b94; }

        /* --- แถบ Gold ด้านบนสุด --- */
        .gold-banner {
            background: linear-gradient(135deg, #fffdf2 0%, #ffffff 100%);
            border: 2px solid #ffebba; border-radius: 20px; padding: 20px 30px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.1); cursor: pointer; transition: transform 0.2s ease;
        }
        .gold-banner:hover { transform: translateY(-3px); }
        .gold-title { font-size: 18px; font-weight: 600; color: #d4af37; display: flex; align-items: center; gap: 10px; }
        .gold-amount { font-size: 24px; font-weight: 600; color: #4a4a4a; }

        /* --- ส่วนของ Grid สมาชิก --- */
        .grid-layout { display: grid; gap: 15px; }
        .members-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        
        .role-section-title {
            color: #7cb9e8; font-size: 18px; font-weight: 600; 
            margin: 30px 0 15px 0; padding-bottom: 5px; 
            border-bottom: 2px dashed #e1eff9; display: flex; align-items: baseline; gap: 10px;
        }

        /* การ์ดสมาชิก */
        .member-card { 
            background: white; border-radius: 16px; padding: 12px 15px; 
            display: flex; align-items: center; gap: 15px; text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
            cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent;
        }
        .member-card:hover { transform: translateY(-3px); border-color: #ffe4e1; box-shadow: 0 6px 15px rgba(255,139,148,0.15); }
        .member-card .item-icon { font-size: 30px; margin-bottom: 0; }
        .member-card .member-info { display: flex; flex-direction: column; }
        .member-card .card-title { font-size: 14px; margin-bottom: 2px; font-weight: 600; }
        .member-card .badges { display: flex; align-items: center; gap: 6px; }
        .member-card .card-badge { margin: 0; padding: 2px 8px; font-size: 11px; }
        .member-card .sub-class-text { margin: 0; font-size: 11px; color: #aaa; }

        /* --- ส่วนของ List (คลังไอเท็ม) --- */
        .item-list-container { display: flex; flex-direction: column; gap: 12px; }
        
        .item-row-card {
            background: white; border-radius: 16px; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03); cursor: pointer; border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .item-row-card:hover { transform: translateY(-2px); border-color: #7cb9e8; box-shadow: 0 5px 15px rgba(124,185,232,0.15); }
        .item-row-card.sold-out { opacity: 0.6; filter: grayscale(50%); }

        .item-row-left { display: flex; align-items: center; gap: 15px; }
        .item-icon-small { font-size: 30px; }
        .item-title-text { font-weight: 600; font-size: 15px; color: #4a4a4a; margin-bottom: 2px; }
        
        .item-row-right { text-align: right; }
        
        .card-badge { 
            background: #f0f4f8; color: #7cb9e8; font-size: 12px; 
            padding: 4px 10px; border-radius: 12px; font-weight: 600; display: inline-block; margin: 2px;
        }
        .card-badge.red { background: #fff0f0; color: #ff8b94; }
        .card-badge.gray { background: #f0f0f0; color: #999; }

        .active-users-box { 
            margin-top: 5px; padding: 4px 8px; font-size: 10px; 
            border-radius: 8px; display: inline-block; text-align: right;
            background: #fdf5f6; border: 1px dashed #ffc6c9; color: #666;
        }
        .active-users-title { color: #ff8b94; font-weight: 600; font-size: 10px;}

        /* --- หน้า Log --- */
        .log-item { 
            background: white; border-radius: 16px; padding: 15px 20px; 
            margin-bottom: 12px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.03); 
        }
        .log-date { font-size: 12px; color: #aaa; margin-top: 4px; }
        .log-detail { font-weight: 600; font-size: 14px;}
        
        /* --- Popup (Modal) --- */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); 
            z-index: 100; justify-content: center; align-items: center; 
        }
        .modal-box { 
            background: white; width: 90%; max-width: 400px; border-radius: 24px; 
            padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; 
            position: relative; max-height: 80vh; display: flex; flex-direction: column;
        }
        .close-btn { 
            position: absolute; top: 15px; right: 20px; font-size: 20px; 
            cursor: pointer; color: #aaa; font-weight: bold; border: none; background: none;
        }
        .holder-list { margin-top: 20px; text-align: left; overflow-y: auto; padding-right: 5px;}
        .holder-item { 
            background: #f9fbfc; padding: 10px 15px; border-radius: 12px; 
            margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☁️ Guild Storage</h1>

    <!-- เมนู Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('page-items')">📦 คลังกิลด์</button>
        <button class="tab-btn" onclick="switchTab('page-members')">👥 สมาชิก</button>
        <button class="tab-btn" onclick="switchTab('page-logs')">📝 ประวัติ</button>
    </div>

    <!-- 1. หน้าคลังไอเท็ม -->
    <div id="page-items" class="page active">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterItems('All', event)">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterItems('Boss Card', event)">🎴 การ์ดบอส</button>
            <button class="filter-btn" onclick="filterItems('Gem Boss', event)">💎 Gem</button>
            <button class="filter-btn" onclick="filterItems('Fragment', event)">🧩 วัตถุดิบ</button>
            <button class="filter-btn" onclick="filterItems('Equipment', event)">🛡️ อุปกรณ์</button>
            <button class="filter-btn" onclick="filterItems('Artifact', event)">✨ Artifact</button>
        </div>
        
        <div id="goldBannerContainer"></div>
        <div class="item-list-container" id="itemsGrid"></div>
    </div>

    <!-- 2. หน้าสมาชิก -->
    <div id="page-members" class="page">
        <div id="membersContainer"></div>
    </div>

    <!-- 3. หน้าประวัติ -->
    <div id="page-logs" class="page">
        <div id="logsContainer"></div>
    </div>
</div>

<!-- Popup สำหรับ ไอเท็ม -->
<div class="modal-overlay" id="itemModal" onclick="closeModal(event, 'itemModal')">
    <div class="modal-box">
        <button class="close-btn" onclick="document.getElementById('itemModal').style.display='none'">×</button>
        <div class="item-icon" id="modalIcon" style="font-size: 50px;">🎁</div>
        <h2 id="modalItemName" style="margin-top: 0; color: #7cb9e8; font-size: 18px;">ชื่อไอเท็ม</h2>
        <div class="card-badge" id="modalBadge" style="margin: 0 auto 15px auto; display: table;">เหลือ: 0/0</div>
        
        <p style="color: #888; font-size: 13px; margin-bottom: 5px; text-align: left; border-bottom: 1px solid #eee; padding-bottom: 5px;">ประวัติการเบิก/ฝาก/ขาย:</p>
        <div class="holder-list" id="modalHolderList"></div>
    </div>
</div>

<!-- Popup สำหรับ สมาชิก -->
<div class="modal-overlay" id="memberModal" onclick="closeModal(event, 'memberModal')">
    <div class="modal-box">
        <button class="close-btn" onclick="document.getElementById('memberModal').style.display='none'">×</button>
        <div class="item-icon" id="memberModalIcon" style="font-size: 50px;">👤</div>
        <h2 id="memberModalName" style="margin-top: 0; color: #7cb9e8; font-size: 18px;">ชื่อตัวละคร</h2>
        <div id="memberModalRoles" style="margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 5px;"></div>
        
        <p style="color: #888; font-size: 13px; margin-bottom: 5px; text-align: left; border-bottom: 1px solid #eee; padding-bottom: 5px;">🎒 ไอเท็มที่กำลังยืมอยู่ตอนนี้:</p>
        <div class="holder-list" id="memberModalItems"></div>
    </div>
</div>

<script>
    // 🔴 ลิงก์ CSV 
    const URL_MEMBERS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=0&single=true&output=csv';
    const URL_ITEMS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=528287579&single=true&output=csv';
    const URL_DEPOSIT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=111778732&single=true&output=csv';

    let dataMembers = [];
    let dataItems = [];
    let dataDeposit = [];
    
    let currentItemFilter = 'All';

    function switchTab(pageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function filterItems(category, event) {
        currentItemFilter = category;
        event.target.parentElement.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.currentTarget.classList.add('active');
        renderItems();
    }

    function fetchData() {
        let noCache = '&t=' + new Date().getTime(); 
        Papa.parse(URL_MEMBERS + noCache, { download: true, header: true, complete: res => { dataMembers = res.data; checkAndRenderAll(); }});
        Papa.parse(URL_ITEMS + noCache, { download: true, header: true, complete: res => { dataItems = res.data; checkAndRenderAll(); }});
        Papa.parse(URL_DEPOSIT + noCache, { download: true, header: true, complete: res => { dataDeposit = res.data; checkAndRenderAll(); }});
    }

    function checkAndRenderAll() {
        if(dataMembers.length > 0 && dataItems.length > 0 && dataDeposit.length > 0) {
            renderItems();
            renderMembers();
            renderLogs();
        }
    }

    function getStatusColor(status) {
        if (!status) return '#aaa';
        if (status.includes('ฝาก') || status.includes('คืน')) return '#7cb9e8'; 
        if (status.includes('เบิก') || status.includes('ยืม')) return '#ff8b94'; 
        if (status.includes('ขาย')) return '#f39c12'; 
        return '#aaa';
    }

    function getActiveHolders(itemName) {
        let balances = {};
        dataDeposit.forEach(row => {
            if (row['ชื่อไอเท็ม'] === itemName) {
                let name = row['อยู่ที่'] || row['อยู่ที่ใคร'] || 'ไม่ระบุชื่อ';
                let status = row['สถานะ'] || '';
                let qty = parseInt(row['จำนวน']) || 0;
                
                if (!balances[name]) balances[name] = 0;
                
                if (status.includes('เบิก') || status.includes('ยืม')) balances[name] += qty;
                if (status.includes('คืน')) balances[name] -= qty;
            }
        });
        
        let active = [];
        for (let name in balances) {
            if (balances[name] > 0) active.push(`👤 ${name} (${balances[name]} ชิ้น)`);
        }
        return active;
    }

    function getBorrowedItemsByMember(memberName) {
        let balances = {};
        dataDeposit.forEach(row => {
            let name = row['อยู่ที่'] || row['อยู่ที่ใคร'] || '';
            if (name === memberName) {
                let itemName = row['ชื่อไอเท็ม'];
                let status = row['สถานะ'] || '';
                let qty = parseInt(row['จำนวน']) || 0;
                
                if (!balances[itemName]) balances[itemName] = 0;
                
                if (status.includes('เบิก') || status.includes('ยืม')) balances[itemName] += qty;
                if (status.includes('คืน')) balances[itemName] -= qty;
            }
        });

        let holdingItems = [];
        for (let item in balances) {
            if (balances[item] > 0) holdingItems.push({ name: item, qty: balances[item] });
        }
        return holdingItems;
    }

    // --- วาดหน้าสมาชิก ---
    function renderMembers() {
        const container = document.getElementById('membersContainer');
        container.innerHTML = '';
        
        const roles = [
            { id: 'DPS', icon: '⚔️', title: 'DPS' },
            { id: 'Tank', icon: '🛡️', title: 'Tank' },
            { id: 'Support', icon: '💖', title: 'Support' }
        ];

        roles.forEach(roleGroup => {
            let filteredMembers = dataMembers.filter(row => row['ตำแหน่ง(หลัก)'] === roleGroup.id && row['ชื่อตัวละคร (IGN)']);
            
            if (filteredMembers.length > 0) {
                let sectionHtml = `
                    <h3 class="role-section-title">
                        ${roleGroup.icon} ${roleGroup.title} 
                        <span style="font-size:14px; color:#aaa;">(${filteredMembers.length} คน)</span>
                    </h3>
                    <div class="grid-layout members-grid">
                `;
                
                filteredMembers.forEach(row => {
                    let memberName = row['ชื่อตัวละคร (IGN)'];
                    let mainClass = row['อาชีพ / คลาส'] || '';
                    let subClass = row['อาชีพรอง'] || ''; 
                    
                    let classHtml = '';
                    if(mainClass) classHtml += `<div class="card-badge">${mainClass}</div>`;
                    if(subClass) classHtml += `<div class="sub-class-text">${subClass}</div>`;

                    let holdingItems = getBorrowedItemsByMember(memberName);
                    let safeName = encodeURIComponent(memberName);
                    let safeMainClass = encodeURIComponent(mainClass);
                    let safeSubClass = encodeURIComponent(subClass);
                    let safeHoldingData = encodeURIComponent(JSON.stringify(holdingItems));

                    sectionHtml += `
                        <div class="member-card" onclick="openMemberModal('${safeName}', '${roleGroup.icon}', '${safeMainClass}', '${safeSubClass}', '${safeHoldingData}')">
                            <div class="item-icon">${roleGroup.icon}</div>
                            <div class="member-info">
                                <div class="card-title">${memberName}</div>
                                <div class="badges">${classHtml}</div>
                            </div>
                        </div>
                    `;
                });

                sectionHtml += `</div>`; 
                container.innerHTML += sectionHtml; 
            }
        });

        if (dataMembers.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #ccc; margin-top: 20px;">ไม่มีข้อมูลสมาชิก 🍃</div>`;
        }
    }

    // --- วาดหน้าไอเท็ม ---
    function renderItems() {
        const grid = document.getElementById('itemsGrid');
        const goldContainer = document.getElementById('goldBannerContainer');
        grid.innerHTML = ''; goldContainer.innerHTML = '';

        let goldItem = dataItems.find(row => row['ชื่อไอเท็ม'] && row['ชื่อไอเท็ม'].trim().toLowerCase() === 'gold');
        let otherItems = dataItems.filter(row => row['ชื่อไอเท็ม'] && row['ชื่อไอเท็ม'].trim().toLowerCase() !== 'gold');

        otherItems.sort((a, b) => a['ชื่อไอเท็ม'].localeCompare(b['ชื่อไอเท็ม'], 'th'));

        if (currentItemFilter !== 'All') {
            otherItems = otherItems.filter(row => {
                let type = row['ประเภท'] || '';
                return type.toLowerCase().includes(currentItemFilter.toLowerCase());
            });
        }

        if (goldItem && (currentItemFilter === 'All')) {
            let qty = goldItem['คงเหลือ'] || '0';
            let displayQty = !isNaN(qty.toString().replace(/,/g, '')) ? Number(qty.toString().replace(/,/g, '')).toLocaleString() : qty;
            let safeGoldName = encodeURIComponent(goldItem['ชื่อไอเท็ม']);

            goldContainer.innerHTML = `
                <div class="gold-banner" onclick="openItemModal('${safeGoldName}', '🪙', '${qty}', '${goldItem['จำนวนทั้งหมด']}')">
                    <div class="gold-title"><span style="font-size: 28px;">🪙</span> Gold กองกลาง</div>
                    <div class="gold-amount">${displayQty} G</div>
                </div>
            `;
        }

        otherItems.forEach(row => {
            if(!row['ชื่อไอเท็ม']) return;
            
            let typeName = row['ประเภท'] || '';
            let icon = '📦';
            if(typeName.includes('Card')) icon = '🎴';
            else if(typeName.includes('Gem')) icon = '💎';
            else if(typeName.includes('Equipment') || typeName.includes('ชุด')) icon = '🛡️';
            else if(typeName.includes('Artifact')) icon = '✨';
            else if(typeName.includes('Fragment') || typeName.includes('วัตถุดิบ')) icon = '🧩';
            
            let total = row['จำนวนทั้งหมด'] || '0';
            let remain = row['คงเหลือ'] || '0';
            
            let badgeClass = 'card-badge';
            let soldOutClass = '';
            if (total === '0' || total === 0) {
                badgeClass = 'card-badge gray'; 
                soldOutClass = 'sold-out';
            } else if (remain === '0' || remain === 0) {
                badgeClass = 'card-badge red'; 
            }

            let activeHolders = getActiveHolders(row['ชื่อไอเท็ม']);
            let holdersHtml = '';
            if (activeHolders.length > 0) {
                holdersHtml = `
                    <div class="active-users-box">
                        <span class="active-users-title">ถูกยืมโดย:</span>
                        ${activeHolders.join(', ')}
                    </div>
                `;
            }

            let safeItemName = encodeURIComponent(row['ชื่อไอเท็ม']);

            grid.innerHTML += `
                <div class="item-row-card ${soldOutClass}" onclick="openItemModal('${safeItemName}', '${icon}', '${remain}', '${total}')">
                    <div class="item-row-left">
                        <div class="item-icon-small">${icon}</div>
                        <div>
                            <div class="item-title-text">${row['ชื่อไอเท็ม']}</div>
                            <div class="sub-class-text">${typeName}</div>
                        </div>
                    </div>
                    <div class="item-row-right">
                        <div class="${badgeClass}">เหลือ: ${remain} / ${total}</div>
                        <br>
                        ${holdersHtml}
                    </div>
                </div>
            `;
        });

        if (otherItems.length === 0 && (!goldItem || currentItemFilter !== 'All')) {
            grid.innerHTML = `<div style="text-align: center; color: #ccc; margin-top: 20px;">ไม่มีไอเท็มในหมวดหมู่นี้ 🍃</div>`;
        }
    }

    // --- วาดหน้าประวัติ (แก้ไข Layout ตามที่ขอ) ---
    function renderLogs() {
        const container = document.getElementById('logsContainer');
        container.innerHTML = '';
        const reversedData = [...dataDeposit].reverse();
        reversedData.forEach(row => {
            if(!row['ชื่อไอเท็ม']) return;
            
            let holderName = row['อยู่ที่'] || row['อยู่ที่ใคร'] || 'ไม่ระบุชื่อ';
            let sColor = getStatusColor(row['สถานะ']);
            
            // เปลี่ยนรูปแบบเป็น "บรรทัดบนชื่อของ บรรทัดล่างชื่อคน-วันที่"
            container.innerHTML += `
                <div class="log-item">
                    <div>
                        <div class="log-detail">${row['ชื่อไอเท็ม']} <span style="font-size:12px; font-weight:normal; color:#888;">x${row['จำนวน']}</span></div>
                        <div class="log-date">👤 ${holderName} &nbsp;•&nbsp; 📅 ${row['วันที่']}</div>
                    </div>
                    <div class="card-badge" style="background: ${sColor}20; color: ${sColor};">${row['สถานะ']}</div>
                </div>
            `;
        });
    }

    function openItemModal(safeItemName, icon, remain, total) {
        let itemName = decodeURIComponent(safeItemName);
        document.getElementById('modalItemName').innerText = itemName;
        document.getElementById('modalIcon').innerText = icon;
        
        let modalBadge = document.getElementById('modalBadge');
        modalBadge.innerText = `สถานะ: ${remain} / ${total} ชิ้น`;
        modalBadge.className = 'card-badge ' + (total == 0 ? 'gray' : (remain == 0 ? 'red' : ''));

        const holderList = document.getElementById('modalHolderList');
        holderList.innerHTML = '';

        let foundLogs = dataDeposit.filter(row => row['ชื่อไอเท็ม'] === itemName);
        let reversedLogs = [...foundLogs].reverse(); 
        
        if (reversedLogs.length === 0) {
            holderList.innerHTML = '<div style="text-align:center; color:#ccc; padding:20px;">ไม่มีประวัติการทำรายการ 🍃</div>';
        } else {
            reversedLogs.forEach(record => {
                let sColor = getStatusColor(record['สถานะ']);
                let holderName = record['อยู่ที่'] || record['อยู่ที่ใคร'] || 'ไม่ระบุชื่อ';

                holderList.innerHTML += `
                    <div class="holder-item">
                        <div>
                            <span style="font-size:11px; color:#aaa; display:block;">${record['วันที่']}</span>
                            <span>👤 ${holderName}</span>
                        </div>
                        <span class="card-badge" style="background:${sColor}20; color:${sColor}; font-size:11px;">
                            ${record['สถานะ']} (${record['จำนวน']})
                        </span>
                    </div>
                `;
            });
        }
        document.getElementById('itemModal').style.display = 'flex';
    }

    function openMemberModal(safeName, icon, safeMainClass, safeSubClass, encodedHoldingData) {
        let name = decodeURIComponent(safeName);
        let mainClass = decodeURIComponent(safeMainClass);
        let subClass = decodeURIComponent(safeSubClass);

        document.getElementById('memberModalName').innerText = name;
        document.getElementById('memberModalIcon').innerText = icon;

        let rolesHtml = '';
        if(mainClass) rolesHtml += `<div><span class="card-badge" style="font-size:14px;">${mainClass}</span></div>`;
        if(subClass) rolesHtml += `<div><span style="font-size:12px; color:#aaa;">(${subClass})</span></div>`;
        document.getElementById('memberModalRoles').innerHTML = rolesHtml;

        const itemsList = document.getElementById('memberModalItems');
        itemsList.innerHTML = '';
        
        let holdingItems = JSON.parse(decodeURIComponent(encodedHoldingData));
        
        if (holdingItems.length === 0) {
            itemsList.innerHTML = '<div style="text-align:center; color:#ccc; padding:20px;">ไม่ได้ยืมไอเท็มกิลด์ไว้ 🍃</div>';
        } else {
            holdingItems.forEach(item => {
                itemsList.innerHTML += `
                    <div class="holder-item">
                        <span>🎁 ${item.name}</span>
                        <span class="card-badge red" style="font-size:12px;">ถืออยู่: ${item.qty} ชิ้น</span>
                    </div>
                `;
            });
        }

        document.getElementById('memberModal').style.display = 'flex';
    }

    function closeModal(e, modalId) {
        if(e.target.id === modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    }

    window.onload = fetchData;
</script>

</body>
</html>
