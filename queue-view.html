<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Queue System (Viewer) ⏱️</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f9fbfc; color: #4a4a4a; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #7cb9e8; font-weight: 600; margin-bottom: 30px; }
        .layout-container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; flex-direction: column; }
        @media(min-width: 900px) { .layout-container { flex-direction: row; align-items: flex-start; } }

        .panel { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; max-height: 85vh; min-width: 0; }
        
        /* ซ่อนห้องสมาชิก (เพราะคนดูไม่ต้องเห็นรายชื่อรอจัด) */
        .roster-panel { display: none; } 
        
        .queue-panel { flex: 1.5; border-top: 6px solid #a8e6cf; }
        .waiting-panel { flex: 1.1; border-top: 6px solid #ffebba; }

        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #eee; padding-bottom: 12px; margin-bottom: 15px; }
        .panel-title { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px;}
        .count-badge { padding: 3px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }

        .queue-panel .panel-title { color: #4bba96; }
        .queue-panel .count-badge { background: #f2fcf9; color: #4bba96; }
        .waiting-panel .panel-title { color: #f39c12; }
        .waiting-panel .count-badge { background: #fffdf2; color: #f39c12; }

        .current-turn-box { background: linear-gradient(135deg, #fffdf2 0%, #ffffff 100%); border: 2px solid #ffebba; border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(255, 215, 0, 0.1); }
        .current-turn-label { font-size: 12px; color: #a0a0a0; margin-bottom: 5px; font-weight: 600;}
        .current-turn-name { font-size: 20px; font-weight: 600; color: #d4af37; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .vertical-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 150px; padding: 10px; border-radius: 12px; }

        .member-card {
            background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 0 10px;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            height: 48px; box-sizing: border-box; width: 100%;
            cursor: default; /* เปลี่ยนเคอร์เซอร์เป็นปกติ ห้ามลาก */
        }
        
        .role-icon { font-size: 18px; padding: 5px; background: #f9fbfc; border-radius: 8px; flex-shrink: 0;}
        .member-name { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        
        .rank-number {
            display: none; width: 28px; height: 28px; background: #4a4a4a; color: white;
            border-radius: 50%; text-align: center; line-height: 28px; font-size: 12px; font-weight: 600; flex-shrink: 0;
        }
        
        .queue-panel .member-card .rank-number { display: block; background: #4bba96; }
        .waiting-panel .member-card .rank-number { display: block; background: #f39c12; }
    </style>
</head>
<body>

    <h1>⏱️ ระบบจัดคิวปาร์ตี้ (สำหรับดูเท่านั้น)</h1>

    <div class="layout-container">
        <!-- ห้อง 2: คิวหลัก (Active Queue) -->
        <div class="panel queue-panel">
            <div class="panel-header">
                <h3 class="panel-title">📋 ห้องคิวหลัก (1-12)</h3>
                <span class="count-badge" id="count-active">0 / 12 คน</span>
            </div>
            
            <div class="current-turn-box">
                <div class="current-turn-label">🎯 คิวปัจจุบัน (อันดับ 1)</div>
                <div class="current-turn-name" id="current-turn-display">กำลังโหลดคิว...</div>
            </div>

            <div class="vertical-list" id="zone-active"></div>
        </div>

        <!-- ห้อง 3: คิวรอ (Waiting) -->
        <div class="panel waiting-panel">
            <div class="panel-header">
                <h3 class="panel-title">⏳ ห้องรอคิว</h3>
                <span class="count-badge" id="count-waiting">รอ 0 คน</span>
            </div>
            <div class="vertical-list" id="zone-waiting"></div>
        </div>
    </div>

<script>
    // ----------------------------------------------------
    // 1. ตั้งค่าฐานข้อมูล Firebase เดียวกันกับของแอดมิน
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCIjmulnl7kcmOhH_w1jSk6-Fms-VQkhsw",
      authDomain: "friendbossqueue.firebaseapp.com",
      databaseURL: "https://friendbossqueue-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "friendbossqueue",
      storageBucket: "friendbossqueue.firebasestorage.app",
      messagingSenderId: "269204814389",
      appId: "1:269204814389:web:98ae14ec160dcfb90dcf7c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const URL_MEMBERS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=0&single=true&output=csv';
    
    let allMembers = [];   
    let activeQueue = [];  
    let waitingQueue = []; 

    function init() {
        let noCache = '&t=' + new Date().getTime(); 
        Papa.parse(URL_MEMBERS + noCache, { 
            download: true, header: true, 
            complete: function(results) {
                let parsed = results.data.filter(row => row['ชื่อตัวละคร (IGN)']);
                allMembers = parsed.map(row => {
                    return { name: row['ชื่อตัวละคร (IGN)'].trim(), role: row['ตำแหน่ง(หลัก)'] || 'DPS' }
                });
                listenToFirebase();
            }
        });
    }

    function listenToFirebase() {
        db.ref('queues').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            activeQueue = data.active || [];
            waitingQueue = data.waiting || [];
            renderAllZones(); 
        });
    }

    function getBaseIcon(roleText) {
        if (!roleText) return '👤'; 
        let r = roleText.toLowerCase();
        if (r.includes('tank')) return '🛡️';
        if (r.includes('support')) return '💖';
        return '⚔️'; 
    }

    // สร้างการ์ด (เอาปุ่มลากและปุ่มกด + ออกหมดแล้ว)
    function createCard(name, role) {
        let icon = getBaseIcon(role);
        let card = document.createElement('div');
        card.className = 'member-card';
        card.dataset.name = name; 

        card.innerHTML = `
            <div class="rank-number">0</div>
            <div class="role-icon">${icon}</div>
            <div class="member-name" title="${name}">${name}</div>
        `;
        return card;
    }

    function renderAllZones() {
        const activeZone = document.getElementById('zone-active');
        const waitZone = document.getElementById('zone-waiting');

        activeZone.innerHTML = '';
        waitZone.innerHTML = '';

        activeQueue.forEach(name => {
            let memberData = allMembers.find(m => m.name === name);
            if(memberData) activeZone.appendChild(createCard(memberData.name, memberData.role));
        });

        waitingQueue.forEach(name => {
            let memberData = allMembers.find(m => m.name === name);
            if(memberData) waitZone.appendChild(createCard(memberData.name, memberData.role));
        });

        updateNumbersUI();
    }

    function updateNumbersUI() {
        const activeZone = document.getElementById('zone-active');
        const waitZone = document.getElementById('zone-waiting');

        document.getElementById('count-waiting').innerText = `รอ ${waitZone.children.length} คน`;

        if (activeZone.children.length > 12) {
            document.getElementById('count-active').style.color = '#ff8b94';
        } else {
            document.getElementById('count-active').style.color = '#4bba96';
        }
        document.getElementById('count-active').innerText = `${activeZone.children.length} / 12 คน`;

        const currentDisplay = document.getElementById('current-turn-display');
        if (activeZone.children.length > 0) {
            const currentName = activeZone.firstElementChild.dataset.name;
            currentDisplay.innerHTML = `✨ ${currentName} ✨`;
            activeZone.firstElementChild.style.borderLeft = "4px solid #d4af37";
        } else {
            currentDisplay.innerText = "- รอจัดคิว -";
        }

        [...activeZone.children].forEach((card, index) => {
            let rankElement = card.querySelector('.rank-number');
            rankElement.innerText = index + 1;
            if(index !== 0) card.style.borderLeft = "1px solid #eee";
        });

        [...waitZone.children].forEach((card, index) => {
            let rankElement = card.querySelector('.rank-number');
            rankElement.innerText = index + 1;
            card.style.borderLeft = "1px solid #eee";
        });
    }

    window.onload = init;
</script>

</body>
</html>
