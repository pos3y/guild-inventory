<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Queue System ⏱️</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- นำเข้า PapaParse สำหรับอ่าน Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <!-- นำเข้า Firebase SDK (เวอร์ชัน Compat ที่ใช้งานง่ายที่สุดสำหรับ HTML เพียว) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        /* --- ธีมหลัก --- */
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f9fbfc; 
            color: #4a4a4a; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { text-align: center; color: #7cb9e8; font-weight: 600; margin-bottom: 20px; }

        .layout-container {
            display: flex; gap: 20px; max-width: 1200px; margin: 0 auto;
            flex-direction: column;
        }
        @media(min-width: 900px) {
            .layout-container { flex-direction: row; align-items: flex-start; }
        }

        /* --- สไตล์กล่องหลักของแต่ละห้อง --- */
        .panel {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); 
            display: flex; flex-direction: column; max-height: 85vh;
            min-width: 0; /* ล็อกไม่ให้กล่องขยายตามตัวอักษร */
        }
        
        .roster-panel { flex: 1.6; border-top: 6px solid #e1eff9; } 
        
        .pool-grid {
            flex: 1; overflow-y: auto; display: grid; gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr)); 
            align-content: start; padding: 10px; min-height: 200px;
            border: 2px dashed transparent; border-radius: 12px; transition: 0.2s;
        }

        .queue-panel { flex: 1.3; border-top: 6px solid #a8e6cf; }
        .waiting-panel { flex: 1.1; border-top: 6px solid #ffebba; }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px dashed #eee; padding-bottom: 12px; margin-bottom: 15px;
        }
        .panel-title { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px;}
        .count-badge { padding: 3px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }

        /* สีตกแต่งแยกตามห้อง */
        .roster-panel .panel-title { color: #7cb9e8; }
        .roster-panel .count-badge { background: #f0f8ff; color: #7cb9e8; }
        
        .queue-panel .panel-title { color: #4bba96; }
        .queue-panel .count-badge { background: #f2fcf9; color: #4bba96; }

        .waiting-panel .panel-title { color: #f39c12; }
        .waiting-panel .count-badge { background: #fffdf2; color: #f39c12; }

        /* --- ป้ายแสดงคิวปัจจุบัน --- */
        .current-turn-box {
            background: linear-gradient(135deg, #fffdf2 0%, #ffffff 100%);
            border: 2px solid #ffebba; border-radius: 16px; padding: 15px;
            text-align: center; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(255, 215, 0, 0.1);
        }
        .current-turn-label { font-size: 12px; color: #a0a0a0; margin-bottom: 5px; font-weight: 600;}
        .current-turn-name { font-size: 20px; font-weight: 600; color: #d4af37; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        /* --- กลุ่มปุ่มกดควบคุมคิว --- */
        .action-buttons {
            display: flex; gap: 10px; margin-bottom: 15px;
        }

        .next-btn {
            background: #4bba96; color: white; border: none; padding: 10px 15px;
            border-radius: 20px; font-family: 'Prompt', sans-serif; font-weight: 600;
            font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(75, 186, 150, 0.3);
            flex: 1;
        }
        .next-btn:hover { background: #3a9f7d; transform: translateY(-2px); }
        .next-btn:active { transform: translateY(0); }

        .clear-btn {
            background: #ff8b94; color: white; border: none; padding: 10px 15px;
            border-radius: 20px; font-family: 'Prompt', sans-serif; font-weight: 600;
            font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(255, 139, 148, 0.3);
            white-space: nowrap;
        }
        .clear-btn:hover { background: #e07a82; transform: translateY(-2px); }
        .clear-btn:active { transform: translateY(0); }

        /* --- ลิสต์แนวตั้ง (สำหรับห้องคิวและห้องรอ) --- */
        .vertical-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            min-height: 150px; padding: 10px; transition: all 0.2s; border-radius: 12px;
            border: 2px dashed transparent;
        }

        .drop-zone.drag-over { background-color: #f0f8ff; border-color: #7cb9e8; }

        /* --- การ์ดสมาชิก --- */
        .member-card {
            background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 0 10px;
            display: flex; align-items: center; gap: 8px; cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: transform 0.1s;
            user-select: none; position: relative;
            
            height: 48px; 
            box-sizing: border-box;
            width: 100%;
        }
        .member-card:hover { border-color: #7cb9e8; box-shadow: 0 4px 8px rgba(124,185,232,0.15);}
        .member-card.dragging { opacity: 0.5; cursor: grabbing; border: 2px dashed #7cb9e8; }
        
        .role-icon { font-size: 18px; padding: 5px; background: #f9fbfc; border-radius: 8px; flex-shrink: 0;}
        
        .member-name { 
            font-size: 13px; font-weight: 600; flex: 1; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0; 
        }
        
        .add-btn {
            background: #e1eff9; color: #7cb9e8; border: none; border-radius: 50%;
            width: 26px; height: 26px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; font-size: 16px; flex-shrink: 0;
        }
        .add-btn:hover { background: #7cb9e8; color: white; }

        .rank-number {
            display: none; width: 28px; height: 28px; background: #4a4a4a; color: white;
            border-radius: 50%; text-align: center; line-height: 28px; font-size: 12px; font-weight: 600; flex-shrink: 0;
        }
        
        .queue-panel .member-card .rank-number { display: block; background: #4bba96; }
        .waiting-panel .member-card .rank-number { display: block; background: #f39c12; }
        
        .roster-panel .member-card .rank-number { display: none; } 
        .queue-panel .member-card .add-btn,
        .waiting-panel .member-card .add-btn { display: none; } 

    </style>
</head>
<body>

    <h1>⏱️ ระบบจัดคิวปาร์ตี้</h1>
    
    <div style="text-align: center; margin-bottom: 25px; margin-top: -20px;">
        <a href="index.html" style="text-decoration: none; background: #f0f4f8; border: 1px solid #7cb9e8; color: #7cb9e8; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-right: 10px;">☁️ กลับคลังกิลด์</a>
        <a href="party.html" style="text-decoration: none; background: #fffdf2; border: 1px solid #d4af37; color: #d4af37; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: 600;">⚔️ ไปหน้าจัดปาร์ตี้</a>
    </div>

    <div class="layout-container">
        
        <!-- ห้อง 1: สมาชิก (Member Pool) -->
        <div class="panel roster-panel">
            <div class="panel-header">
                <h3 class="panel-title">👥 สมาชิก</h3>
                <span class="count-badge" id="count-pool">0 คน</span>
            </div>
            <div class="pool-grid drop-zone" id="zone-pool"></div>
        </div>

        <!-- ห้อง 2: คิวหลัก (Active Queue) -->
        <div class="panel queue-panel">
            <div class="panel-header">
                <h3 class="panel-title">📋 ห้องคิวหลัก (1-12)</h3>
                <span class="count-badge" id="count-active">0 / 12 คน</span>
            </div>
            
            <div class="current-turn-box">
                <div class="current-turn-label">🎯 คิวปัจจุบัน (อันดับ 1)</div>
                <div class="current-turn-name" id="current-turn-display">กำลังโหลดคิว...</div>
            </div>

            <!-- กลุ่มปุ่มควบคุม -->
            <div class="action-buttons">
                <button class="next-btn" onclick="nextQueue()">▶️ จบเทิร์น (เลื่อนคิวถัดไป)</button>
                <button class="clear-btn" onclick="clearQueue()">🗑️ ล้างคิว</button>
            </div>

            <div class="vertical-list drop-zone" id="zone-active"></div>
        </div>

        <!-- ห้อง 3: คิวรอ (Waiting) -->
        <div class="panel waiting-panel">
            <div class="panel-header">
                <h3 class="panel-title">⏳ ห้องรอคิว</h3>
                <span class="count-badge" id="count-waiting">รอ 0 คน</span>
            </div>
            <p style="font-size: 11px; color: #aaa; text-align: center; margin-top: -10px;">(จะถูกดึงเข้าห้องคิวหลักอัตโนมัติ)</p>
            
            <div class="vertical-list drop-zone" id="zone-waiting"></div>
        </div>

    </div>

<script>
    // ----------------------------------------------------
    // 1. ตั้งค่าฐานข้อมูล Firebase
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCIjmulnl7kcmOhH_w1jSk6-Fms-VQkhsw",
      authDomain: "friendbossqueue.firebaseapp.com",
      databaseURL: "https://friendbossqueue-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "friendbossqueue",
      storageBucket: "friendbossqueue.firebasestorage.app",
      messagingSenderId: "269204814389",
      appId: "1:269204814389:web:98ae14ec160dcfb90dcf7c",
      measurementId: "G-03R1X1L4EQ"
    };

    // เปิดใช้งาน Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ----------------------------------------------------
    // 2. ลอจิกของกิลด์
    // ----------------------------------------------------
    const URL_MEMBERS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=0&single=true&output=csv';
    
    let allMembers = [];   // รายชื่อดั้งเดิมจาก Sheet ทั้งหมด
    let activeQueue = [];  // คิวหลักที่เก็บใน Firebase (เก็บเฉพาะชื่อ)
    let waitingQueue = []; // คิวรอที่เก็บใน Firebase (เก็บเฉพาะชื่อ)
    
    let isDragging = false; // ตัวแปรดักไว้ว่าเรากำลังลากการ์ดอยู่หรือเปล่า

    // ฟังก์ชันเริ่มโหลดข้อมูล
    function init() {
        let noCache = '&t=' + new Date().getTime(); 
        Papa.parse(URL_MEMBERS + noCache, { 
            download: true, header: true, 
            complete: function(results) {
                let parsed = results.data.filter(row => row['ชื่อตัวละคร (IGN)']);
                // แมพเก็บแค่ชื่อกับอาชีพ และเรียงตัวอักษร
                allMembers = parsed.map(row => {
                    return {
                        name: row['ชื่อตัวละคร (IGN)'].trim(),
                        role: row['ตำแหน่ง(หลัก)'] || 'DPS'
                    }
                }).sort((a, b) => a.name.localeCompare(b.name, 'th'));

                // เริ่มฟังสัญญาณข้อมูลแบบสดๆ จาก Firebase
                listenToFirebase();
            }
        });
        setupDropZones(); // เปิดระบบลากวาง
    }

    // ฟังก์ชันเชื่อมต่อกับฐานข้อมูลแบบ Real-time
    function listenToFirebase() {
        db.ref('queues').on('value', (snapshot) => {
            // ถ้ายูสเซอร์คนนี้กำลัง "ลากเมาส์ค้างอยู่" อย่าเพิ่งอัปเดตหน้าจอเดี๋ยวการ์ดหลุดมือ
            if (isDragging) return; 

            const data = snapshot.val() || {};
            activeQueue = data.active || [];
            waitingQueue = data.waiting || [];
            
            renderAllZones(); // วาดการ์ดลงกล่องใหม่ทั้งหมด
        });
    }

    // เซฟการจัดเรียงจากหน้าเว็บ โยนกลับเข้า Firebase
    function saveQueuesToFirebase() {
        const zoneActive = document.getElementById('zone-active');
        const zoneWaiting = document.getElementById('zone-waiting');

        // อ่านชื่อจากการ์ดที่อยู่ในห้องนั้นๆ เรียงตามลำดับบนหน้าจอ
        const newActive = [...zoneActive.children].map(card => card.dataset.name);
        const newWait = [...zoneWaiting.children].map(card => card.dataset.name);

        // อัปโหลดขึ้นเซิร์ฟเวอร์
        db.ref('queues').set({
            active: newActive,
            waiting: newWait
        });
    }

    function getBaseIcon(roleText) {
        if (!roleText) return '👤'; 
        let r = roleText.toLowerCase();
        if (r.includes('tank')) return '🛡️';
        if (r.includes('support')) return '💖';
        return '⚔️'; 
    }

    // สร้างการ์ด 1 ใบ (ใช้ร่วมกันทุกห้อง)
    function createCard(name, role) {
        let icon = getBaseIcon(role);
        let card = document.createElement('div');
        card.className = 'member-card';
        card.draggable = true;
        card.dataset.name = name; // แอบเก็บชื่อไว้ใช้ตอนเซฟ

        card.innerHTML = `
            <div class="rank-number">0</div>
            <div class="role-icon">${icon}</div>
            <div class="member-name" title="${name}">${name}</div>
            <button class="add-btn" onclick="moveToQueue(this)" title="เพิ่มเข้าคิว">+</button>
            <div style="cursor: grab; color: #ccc;" title="ลากเพื่อสลับที่">☰</div>
        `;

        card.addEventListener('dragstart', dragStart);
        card.addEventListener('dragend', dragEnd);
        return card;
    }

    // วาดหน้าจอใหม่ทั้งหมดโดยดึงอ้างอิงจากคิวใน Firebase
    function renderAllZones() {
        const poolZone = document.getElementById('zone-pool');
        const activeZone = document.getElementById('zone-active');
        const waitZone = document.getElementById('zone-waiting');

        poolZone.innerHTML = '';
        activeZone.innerHTML = '';
        waitZone.innerHTML = '';

        // 1. วาดห้องคิวหลักก่อน (ตามลำดับใน Firebase)
        activeQueue.forEach(name => {
            let memberData = allMembers.find(m => m.name === name);
            if(memberData) activeZone.appendChild(createCard(memberData.name, memberData.role));
        });

        // 2. วาดห้องรอคิว
        waitingQueue.forEach(name => {
            let memberData = allMembers.find(m => m.name === name);
            if(memberData) waitZone.appendChild(createCard(memberData.name, memberData.role));
        });

        // 3. วาดห้องรวม (เฉพาะคนที่ "ไม่ได้" อยู่ใน Active และ Waiting)
        allMembers.forEach(m => {
            if (!activeQueue.includes(m.name) && !waitingQueue.includes(m.name)) {
                poolZone.appendChild(createCard(m.name, m.role));
            }
        });

        updateNumbersUI();
    }

    // --- ระบบเพิ่มเข้าคิวด้วยการกดปุ่ม + ---
    function moveToQueue(btnElement) {
        let name = btnElement.closest('.member-card').dataset.name;
        
        // อัปเดต Array แล้วโยนขึ้น Firebase
        if (activeQueue.length < 12) {
            activeQueue.push(name);
        } else {
            waitingQueue.push(name);
        }
        
        db.ref('queues').set({ active: activeQueue, waiting: waitingQueue });
    }

    // --- ระบบปุ่ม เลื่อนคิว (Next Queue) ---
    function nextQueue() {
        if (activeQueue.length === 0) return;

        // ดึงชื่อคนที่ 1 ออกไป (มันจะกลับไปอยู่ Pool ตอน Render อัตโนมัติเพราะไม่มีชื่อในคิวแล้ว)
        activeQueue.shift(); 
        
        // ถ้ามีคนรอคิว ดึงคนแรกของคิวรอมาเสียบหลังคิวหลัก
        if (waitingQueue.length > 0) {
            activeQueue.push(waitingQueue.shift()); 
        }

        // เซฟลง Firebase
        db.ref('queues').set({ active: activeQueue, waiting: waitingQueue });
    }

    // --- ระบบล้างคิว (Clear Queue) ---
    function clearQueue() {
        if (confirm("⚠️ แน่ใจหรือไม่ว่าต้องการ 'ล้างคิวทั้งหมด'?\n(สมาชิกทุกคนจะถูกส่งกลับไปที่ห้องรวมทันที)")) {
            // โยน Array ว่างเปล่าขึ้น Firebase ไปล้างกระดาน
            db.ref('queues').set({ active: [], waiting: [] });
        }
    }

    // --- ระบบ Drag & Drop ---
    function dragStart(e) {
        isDragging = true;
        this.classList.add('dragging');
    }

    function dragEnd() {
        this.classList.remove('dragging');
        isDragging = false;
        
        // พอปล่อยเมาส์ ให้อ่านการจัดเรียงบนหน้าจอ แล้วเซฟทับขึ้นฐานข้อมูลเลย!
        saveQueuesToFirebase(); 
    }

    function setupDropZones() {
        const zones = document.querySelectorAll('.drop-zone');
        zones.forEach(zone => {
            zone.addEventListener('dragover', function(e) {
                e.preventDefault(); 
                this.classList.add('drag-over');

                const draggable = document.querySelector('.dragging');
                if (draggable) {
                    const afterElement = getDragAfterElement(this, e.clientY);
                    if (afterElement == null) {
                        this.appendChild(draggable);
                    } else {
                        this.insertBefore(draggable, afterElement);
                    }
                }
            });
            
            zone.addEventListener('dragleave', function(e) {
                this.classList.remove('drag-over');
            });

            zone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                // ตัวเซฟเข้า Firebase จะทำงานที่ dragEnd() ครับ
            });
        });
    }

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.member-card:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // --- ระบบจัด UI การนับเลข ---
    function updateNumbersUI() {
        const poolZone = document.getElementById('zone-pool');
        const activeZone = document.getElementById('zone-active');
        const waitZone = document.getElementById('zone-waiting');

        document.getElementById('count-pool').innerText = `${poolZone.children.length} คน`;
        document.getElementById('count-waiting').innerText = `รอ ${waitZone.children.length} คน`;

        if (activeZone.children.length > 12) {
            document.getElementById('count-active').style.color = '#ff8b94';
        } else {
            document.getElementById('count-active').style.color = '#4bba96';
        }
        document.getElementById('count-active').innerText = `${activeZone.children.length} / 12 คน`;

        const currentDisplay = document.getElementById('current-turn-display');
        if (activeZone.children.length > 0) {
            const currentName = activeZone.firstElementChild.dataset.name;
            currentDisplay.innerHTML = `✨ ${currentName} ✨`;
            activeZone.firstElementChild.style.borderLeft = "4px solid #d4af37";
        } else {
            currentDisplay.innerText = "- รอจัดคิว -";
        }

        // รันตัวเลขลำดับในหน้าจอ
        [...activeZone.children].forEach((card, index) => {
            let rankElement = card.querySelector('.rank-number');
            rankElement.innerText = index + 1;
            if(index !== 0) card.style.borderLeft = "1px solid #eee";
        });

        [...waitZone.children].forEach((card, index) => {
            let rankElement = card.querySelector('.rank-number');
            rankElement.innerText = index + 1;
            card.style.borderLeft = "1px solid #eee";
        });
        
        [...poolZone.children].forEach(card => {
            card.style.borderLeft = "1px solid #eee";
        });
    }

    // เริ่มทำงานเมื่อเปิดเว็บ
    window.onload = init;
</script>

</body>
</html>
