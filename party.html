<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Raid Organizer ⚔️</title>
    <!-- นำเข้าฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        /* --- ธีมหลัก --- */
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f9fbfc; 
            color: #4a4a4a; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { text-align: center; color: #7cb9e8; font-weight: 600; margin-bottom: 30px; }

        .layout-container {
            display: flex; gap: 20px; max-width: 1200px; margin: 0 auto;
            flex-direction: column;
        }
        @media(min-width: 768px) {
            .layout-container { flex-direction: row; }
        }

        /* --- ฝั่งซ้าย: Member Pool --- */
        .roster-panel {
            flex: 1; background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); border: 2px dashed #e1eff9;
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .roster-header {
            display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
        }
        .roster-title { font-size: 18px; font-weight: 600; color: #7cb9e8; margin: 0; }
        .member-pool {
            flex: 1; overflow-y: auto; display: grid; gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            align-content: start; min-height: 150px; padding-bottom: 10px;
        }

        /* --- ฝั่งขวา: Raid Party --- */
        .raid-panel {
            flex: 2; display: flex; flex-direction: column; gap: 15px;
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); border-top: 6px solid #ffebba;
        }
        .raid-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px dashed #eee; padding-bottom: 15px; margin-bottom: 10px;
        }
        .raid-title { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px;}
        .raid-total-badge {
            background: #fffdf2; color: #d4af37; border: 1px solid #d4af37;
            padding: 5px 15px; border-radius: 20px; font-size: 16px; font-weight: 600;
        }

        /* โซนของแต่ละ Role ใน Raid */
        .role-section {
            background: #fdfdfd; border: 1px solid #f0f0f0; border-radius: 16px; 
            padding: 10px 15px; display: flex; flex-direction: column;
        }
        .role-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;
        }
        .role-title { font-size: 15px; font-weight: 600; margin: 0; }
        .role-count { font-size: 13px; color: #888; background: #eee; padding: 2px 10px; border-radius: 12px; }

        /* พื้นที่วางการ์ด (Drop Zone) */
        .drop-zone {
            display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            min-height: 50px; padding: 10px; transition: all 0.2s; border-radius: 12px;
            border: 2px dashed transparent; align-content: start;
        }
        .drop-zone.drag-over { background-color: #f0f8ff; border-color: #7cb9e8; }

        /* สีพิเศษของแต่ละ Role */
        .role-section.dps .role-title { color: #ff8b94; }
        .role-section.dps .role-count { background: #fff0f0; color: #ff8b94; }
        
        .role-section.tank .role-title { color: #7cb9e8; }
        .role-section.tank .role-count { background: #f0f4f8; color: #7cb9e8; }
        
        .role-section.support .role-title { color: #a8e6cf; }
        .role-section.support .role-count { background: #f2fcf9; color: #4bba96; }

        /* --- การ์ดสมาชิก --- */
        .member-card {
            background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 10px;
            display: flex; align-items: center; gap: 8px; cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: all 0.2s ease;
            user-select: none;
        }
        .member-card:hover { transform: translateY(-2px); border-color: #7cb9e8; box-shadow: 0 4px 8px rgba(124,185,232,0.15);}
        .member-card:active { cursor: grabbing; }
        
        .role-icon {
            font-size: 20px; padding: 5px; background: #f9fbfc;
            border-radius: 8px; flex-shrink: 0;
        }
        .member-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;}
    </style>
</head>
<body>

    <h1>⚔️ จัดทีมลุย Raid </h1>
    
    <div style="text-align: center; margin-bottom: 25px; margin-top: -15px;">
        <a href="index.html" style="text-decoration: none; background: #f0f4f8; border: 1px solid #7cb9e8; color: #7cb9e8; padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: 600;">☁️ กลับคลังกิลด์</a>
    </div>

    <div class="layout-container">
        
        <!-- ฝั่งซ้าย: รายชื่อสมาชิกทั้งหมด -->
        <div class="roster-panel">
            <div class="roster-header">
                <h3 class="roster-title">👥 รายชื่อสมาชิก</h3>
            </div>
            <p style="font-size: 12px; color: #888; margin-top: -5px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                ลากชื่อข้ามไปจัดตี้ฝั่งขวา
            </p>
            <div class="member-pool drop-zone" id="zone-pool">
                <!-- การ์ดสมาชิกจะโผล่ที่นี่ -->
            </div>
        </div>

        <!-- ฝั่งขวา: Raid Party -->
        <div class="raid-panel">
            <div class="raid-header">
                <h3 class="raid-title">🛡️ กองกำลัง Raid</h3>
                <div class="raid-total-badge" id="total-count">รวม: 0 คน</div>
            </div>

            <!-- หมวด DPS -->
            <div class="role-section dps">
                <div class="role-header">
                    <h4 class="role-title">⚔️ หน่วยทำดาเมจ (DPS)</h4>
                    <span class="role-count" id="count-dps">0 คน</span>
                </div>
                <div class="drop-zone" id="zone-dps" data-role="dps"></div>
            </div>

            <!-- หมวด Tank -->
            <div class="role-section tank">
                <div class="role-header">
                    <h4 class="role-title">🛡️ หน่วยแทงค์ (Tank)</h4>
                    <span class="role-count" id="count-tank">0 คน</span>
                </div>
                <div class="drop-zone" id="zone-tank" data-role="tank"></div>
            </div>

            <!-- หมวด Support -->
            <div class="role-section support">
                <div class="role-header">
                    <h4 class="role-title">💖 หน่วยซัพพอร์ต (Support)</h4>
                    <span class="role-count" id="count-support">0 คน</span>
                </div>
                <div class="drop-zone" id="zone-support" data-role="support"></div>
            </div>

        </div>
    </div>

<script>
    // 🔴 ลิงก์ CSV จากระบบเดิม
    const URL_MEMBERS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR9vhvIhGr5ZWf2qc1lZkDxHXF4-1fL-t9Lv0PsMcos_87S934rav15rgRxhNbRCKdIoCwF1bi4eivD/pub?gid=0&single=true&output=csv';
    
    let members = [];
    let draggedItem = null;

    // ระบบ Role
    const rolesData = {
        'dps': { icon: '⚔️', title: 'DPS' },
        'tank': { icon: '🛡️', title: 'Tank' },
        'support': { icon: '💖', title: 'Support' }
    };

    function fetchMembers() {
        let noCache = '&t=' + new Date().getTime(); 
        Papa.parse(URL_MEMBERS + noCache, { 
            download: true, 
            header: true, 
            complete: function(results) {
                members = results.data.filter(row => row['ชื่อตัวละคร (IGN)']);
                
                members.sort((a, b) => {
                    let roleA = getBaseRole(a['ตำแหน่ง(หลัก)']);
                    let roleB = getBaseRole(b['ตำแหน่ง(หลัก)']);
                    
                    const roleWeights = { 'dps': 1, 'tank': 2, 'support': 3 };
                    let diff = roleWeights[roleA] - roleWeights[roleB];
                    
                    if (diff !== 0) return diff; 
                    
                    let nameA = (a['ชื่อตัวละคร (IGN)'] || '').trim();
                    let nameB = (b['ชื่อตัวละคร (IGN)'] || '').trim();
                    return nameA.localeCompare(nameB, 'th');
                });

                renderPool();
            }
        });
    }

    function getBaseRole(roleText) {
        if (!roleText) return 'dps'; 
        let r = roleText.toLowerCase();
        if (r.includes('tank')) return 'tank';
        if (r.includes('support')) return 'support';
        return 'dps'; 
    }

    function renderPool() {
        const pool = document.getElementById('zone-pool');
        pool.innerHTML = '';
        
        members.forEach((m, index) => {
            let name = m['ชื่อตัวละคร (IGN)'].trim();
            let baseRole = getBaseRole(m['ตำแหน่ง(หลัก)']);
            let icon = rolesData[baseRole].icon;

            let card = document.createElement('div');
            card.className = 'member-card';
            card.draggable = true;
            card.id = 'member-' + index;
            // บันทึกตำแหน่งดั้งเดิมเก็บไว้ด้วย!
            card.dataset.role = baseRole;
            card.dataset.originalRole = baseRole; 

            card.innerHTML = `
                <div class="role-icon" title="${rolesData[baseRole].title}">${icon}</div>
                <div class="member-name">${name}</div>
            `;

            card.addEventListener('dragstart', dragStart);
            card.addEventListener('dragend', dragEnd);

            pool.appendChild(card);
        });

        setupDropZones();
        updateCounts();
    }

    function dragStart(e) {
        draggedItem = this;
        setTimeout(() => this.style.opacity = '0.4', 0);
    }

    function dragEnd() {
        this.style.opacity = '1';
        draggedItem = null;
        updateCounts();
    }

    function setupDropZones() {
        const zones = document.querySelectorAll('.drop-zone');
        zones.forEach(zone => {
            zone.addEventListener('dragover', function(e) {
                e.preventDefault(); 
                this.classList.add('drag-over');
            });
            
            zone.addEventListener('dragleave', function(e) {
                this.classList.remove('drag-over');
            });

            zone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');

                if (draggedItem) {
                    if (this.id === 'zone-pool') {
                        // ถ้าลากกลับมาที่บ่อสมาชิก (ฝั่งซ้าย) ดึงเอา originalRole กลับมาใช้
                        let origRole = draggedItem.dataset.originalRole;
                        draggedItem.dataset.role = origRole;
                        draggedItem.querySelector('.role-icon').innerText = rolesData[origRole].icon;
                        draggedItem.querySelector('.role-icon').title = rolesData[origRole].title;
                    } else {
                        // ถ้าลากไปจัดตี้ (ฝั่งขวา) ให้เปลี่ยนไอคอนตามโซนนั้นๆ
                        let dropRole = this.dataset.role; 
                        if (dropRole) {
                            draggedItem.dataset.role = dropRole;
                            draggedItem.querySelector('.role-icon').innerText = rolesData[dropRole].icon;
                            draggedItem.querySelector('.role-icon').title = rolesData[dropRole].title;
                        }
                    }
                    this.appendChild(draggedItem);
                }
            });
        });
    }

    function updateCounts() {
        let dpsCount = document.getElementById('zone-dps').children.length;
        let tankCount = document.getElementById('zone-tank').children.length;
        let suppCount = document.getElementById('zone-support').children.length;
        
        let total = dpsCount + tankCount + suppCount;

        document.getElementById('count-dps').innerText = `${dpsCount} คน`;
        document.getElementById('count-tank').innerText = `${tankCount} คน`;
        document.getElementById('count-support').innerText = `${suppCount} คน`;
        
        document.getElementById('total-count').innerText = `รวม: ${total} คน`;
        
        let totalBadge = document.getElementById('total-count');
        if(total > 12) {
            totalBadge.style.color = '#ff8b94';
            totalBadge.style.borderColor = '#ff8b94';
            totalBadge.style.background = '#fff0f0';
        } else {
            totalBadge.style.color = '#d4af37';
            totalBadge.style.borderColor = '#d4af37';
            totalBadge.style.background = '#fffdf2';
        }
    }

    window.onload = fetchMembers;
</script>

</body>
</html>
